name: Build BatteryBoi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project BatteryBoi.xcodeproj \
            -scheme BatteryBoi \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign and zip
        run: |
          APP="build/Build/Products/Release/BatteryBoi.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" BatteryBoi.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryBoi
          path: BatteryBoi.zip
