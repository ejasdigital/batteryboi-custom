name: Build BatteryBoi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BatteryBoi.xcodeproj \
            -scheme BatteryBoi \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log || {
              grep -E "error:|fatal error|BUILD FAILED|xcodebuild: error" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
              exit 1
            }

      - name: Ad-hoc sign and zip
        run: |
          APP="build/Build/Products/Release/BatteryBoi.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" BatteryBoi.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryBoi
          path: BatteryBoi.zip
